kind = "web"
previewPath = "/"
title = "BusLoot"
version = "1.0.0"
id = "artifacts/busloot"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22324

[services.development]
run = "pnpm --filter @workspace/busloot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/busloot", "run", "build" ]
publicDir = "artifacts/busloot/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22324"
BASE_PATH = "/"
